# Server
server.port=8080

# Application
spring.application.name=oil-on-canvas-backend

# OpenAI (use env: export OPENAI_API_KEY=your_key)
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=gpt-4o-mini

# Canvas API (for single-token dev; use CANVAS_BASE_URL and CANVAS_ACCESS_TOKEN)
canvas.base.url=${CANVAS_BASE_URL:}
canvas.access.token=${CANVAS_ACCESS_TOKEN:}

# JPA and MySQL
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT}/ooc
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Cache
spring.cache.cache-names=enrolledCourses,userProfile
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m
# 12 hours in milliseconds
cache.refresh.rate.ms=43200000